[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-market"
version = "0.1.0"
description = "Daily macro market price snapshot and summary via Gmail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2.40",
  "requests>=2.31.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
