name: TruthSocial Monitor

on:
  schedule:
    - cron: "0 * * * *"   # every hour on the hour (UTC)
  workflow_dispatch:

concurrency:
  group: truthsocial-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: self-hosted
    permissions:
      contents: write

    defaults:
      run:
        working-directory: truthsocial-monitor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install package
        run: |
          /opt/homebrew/bin/python3 -m pip install --upgrade pip -q
          /opt/homebrew/bin/python3 -m pip install . -q

      - name: Scrape and alert
        env:
          TRUTHSOCIAL_USERNAME: ${{ secrets.TRUTHSOCIAL_USERNAME }}
          TRUTHSOCIAL_PASSWORD: ${{ secrets.TRUTHSOCIAL_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          /opt/homebrew/bin/python3 - <<'EOF'
          import sys
          from truthsocial_monitor.pipeline import run_once
          from truthsocial_monitor.alerter import check_and_alert
          from truthsocial_monitor.config import get_gmail_credentials, get_state_dir

          result = run_once()
          print(f"status={result.status}  new_posts={result.new_posts_count}  error={result.error}")

          if result.status == "error":
              sys.exit(1)

          if result.status == "ok" and result.new_posts:
              sender, app_password, recipient = get_gmail_credentials()
              if sender and app_password and recipient:
                  sent = check_and_alert(
                      result.new_posts,
                      state_dir=get_state_dir(),
                      sender=sender,
                      app_password=app_password,
                      recipient=recipient,
                      cooldown_secs=0,
                  )
                  print(f"alert_sent={sent}")
              else:
                  print("Gmail credentials not set — skipping alert.")
          EOF

      - name: Commit state and database
        working-directory: .
        run: |
          git config user.name "truthsocial-monitor[bot]"
          git config user.email "truthsocial-monitor[bot]@users.noreply.github.com"
          git add truthsocial-monitor/state truthsocial-monitor/data/trump_posts.db
          git diff --staged --quiet || git commit -m "data: update trump_posts.db $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
