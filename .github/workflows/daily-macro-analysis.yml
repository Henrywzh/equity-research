name: Daily Macro Analysis

on:
  workflow_run:
    workflows:
      - Daily Macro Scraper
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: daily-macro-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: daily-macro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-macro/pyproject.toml

      - name: Set up report date
        id: report-date
        run: echo "report_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run daily analysis
        id: analyze
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DAILY_MACRO_LLM_PARALLELISM: "3"
          DAILY_MACRO_LLM_READ_TIMEOUT_SECONDS: "30"
          DAILY_MACRO_LLM_DEADLINE_SECONDS: "45"
          DAILY_MACRO_LLM_TIMEOUT_COOLDOWN_SECONDS: "30"
        run: |
          python -m daily_macro analyze today --force --json > analysis-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("analysis-result.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"report_path={result['output_path']}\n")
              handle.write(f"report_status={result['status']}\n")
          PY

      - name: Summarize analysis outcome
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          result_path = Path("analysis-result.json")
          if not result_path.exists():
              summary = "## Daily Macro Analysis\n\nNo analysis-result.json was produced.\n"
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
              print(summary)
              raise SystemExit(0)

          result = json.loads(result_path.read_text(encoding="utf-8"))
          errors = list(result.get("errors") or [])
          classifications = [str(item.get("classification") or "unclassified") for item in errors]
          counts = Counter(classifications)
          lines = [
              "## Daily Macro Analysis",
              "",
              f"- Report date: `{result.get('report_date')}`",
              f"- Status: `{result.get('status')}`",
              f"- Articles: `{(result.get('totals') or {}).get('article_count', 0)}`",
              f"- Categories: `{(result.get('input') or {}).get('category_count', 0)}`",
              f"- Report path: `{result.get('output_path')}`",
              "",
              "### Category outcomes",
          ]

          for category in result.get("categories") or []:
              diagnostics = category.get("diagnostics") or {}
              lines.append(
                  "- "
                  f"{category.get('category')}: status=`{category.get('status')}`, "
                  f"sub_batches=`{diagnostics.get('sub_batch_count', category.get('sub_batch_count', 0))}`, "
                  f"split_reasons=`{','.join(diagnostics.get('split_reasons') or []) or 'none'}`"
              )

          lines.extend(["", "### Failure classifications"])
          if counts:
              for key, value in sorted(counts.items()):
                  lines.append(f"- `{key}`: {value}")
          else:
              lines.append("- none")

          if errors:
              lines.extend(["", "### Error details"])
              for item in errors:
                  lines.append(
                      "- "
                      f"{item.get('type')} target=`{item.get('target')}` "
                      f"classification=`{item.get('classification') or 'unclassified'}` "
                      f"message={json.dumps(str(item.get('message') or ''))}"
                  )

          text = "\n".join(lines) + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Upload analysis artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-macro-analysis-${{ steps.report-date.outputs.report_date }}
          if-no-files-found: warn
          path: |
            daily-macro/analysis-result.json
            daily-macro/data/analyses/${{ steps.report-date.outputs.report_date }}/hkej-news-analysis.json

      - name: Commit updated analysis artifacts
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "daily-macro-analysis[bot]"
          git config user.email "daily-macro-analysis[bot]@users.noreply.github.com"
          git add daily-macro/data/analyses
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "data: refresh daily macro analysis $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase --autostash origin/main
          done
          echo "Failed to push daily-macro analysis artifacts after 3 attempts." >&2
          exit 1

      - name: Notify when analysis is sendable
        if: ${{ steps.analyze.outputs.report_status == 'success' || steps.analyze.outputs.report_status == 'partial' }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python -m daily_macro notify --result-path "${{ steps.analyze.outputs.report_path }}"

      - name: Skip notification for unsupported report status
        if: ${{ steps.analyze.outputs.report_status != 'success' && steps.analyze.outputs.report_status != 'partial' }}
        run: |
          echo "Skipping Gmail because analysis report status was ${{ steps.analyze.outputs.report_status }}."
