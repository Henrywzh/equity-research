name: Daily Macro Analysis

on:
  workflow_run:
    workflows:
      - Daily Macro Scraper
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: daily-macro-analysis
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: daily-macro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-macro/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run daily analysis
        id: analyze
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m daily_macro analyze today --force --json > analysis-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("analysis-result.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"report_path={result['output_path']}\n")
              handle.write(f"report_status={result['status']}\n")
          PY

      - name: Commit updated analysis artifacts
        working-directory: .
        run: |
          git config user.name "daily-macro-analysis[bot]"
          git config user.email "daily-macro-analysis[bot]@users.noreply.github.com"
          git add daily-macro/data/analyses
          git diff --staged --quiet || git commit -m "data: refresh daily macro analysis $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push

      - name: Notify when analysis succeeds
        if: ${{ steps.analyze.outputs.report_status == 'success' }}
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python -m daily_macro notify --result-path "${{ steps.analyze.outputs.report_path }}"

      - name: Skip notification for non-success report
        if: ${{ steps.analyze.outputs.report_status != 'success' }}
        run: |
          echo "Skipping Gmail because analysis report status was ${{ steps.analyze.outputs.report_status }}."
