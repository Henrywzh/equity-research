name: Unified Hub Update

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Marine Monitor API", "Daily Macro Analysis", "Youtube Run", "Daily Market Polymarket"]
    types:
      - completed

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas plotly numpy yfinance
          python -m pip install ./daily-macro ./daily-market

      - name: Run Market Analysis Tracker
        run: python market_analysis/track_hub.py

      - name: Run Aggregator
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd)/daily-macro/src python hub/aggregator.py

      - name: Commit updated signals
        run: |
          set -euo pipefail
          git config user.name "hub-bot[bot]"
          git config user.email "hub-bot[bot]@users.noreply.github.com"
          git add hub/data/signals.json hub/data/hormuz.json hub/data/polymarket.json hub/index.html hub/polymarket.html hub/market-analysis.html hub/css/styles.css data/cache/etf_data_5y.pkl
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh unified intelligence hub $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            commit_sha=$(git rev-parse HEAD)
            echo "Created hub refresh commit: ${commit_sha}"
            push_log=$(mktemp)
            for attempt in 1 2 3; do
              echo "Push attempt ${attempt} for ${commit_sha}"
              if git push origin HEAD:main 2>&1 | tee "${push_log}"; then
                exit 0
              fi
              echo "Push attempt ${attempt} failed for ${commit_sha}" >&2
              if grep -q "fatal error in commit_refs" "${push_log}"; then
                echo "GitHub ref update failed remotely (commit_refs). Treating as transient infrastructure failure." >&2
              fi
              sleep_seconds=$((30 * attempt))
              echo "Retrying after ${sleep_seconds}s backoff..." >&2
              sleep "${sleep_seconds}"
              git fetch origin main
              git rebase --autostash origin/main
            done
            echo "Failed to push hub signals after 3 attempts. Last commit: ${commit_sha}" >&2
            exit 1
          fi
