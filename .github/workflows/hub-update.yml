name: Unified Hub Update

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Marine Monitor API", "Daily Macro Analysis", "Youtube Run"]
    types:
      - completed

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Aggregator
        run: |
          python hub/aggregator.py

      - name: Commit updated signals
        run: |
          set -euo pipefail
          git config user.name "hub-bot[bot]"
          git config user.email "hub-bot[bot]@users.noreply.github.com"
          git add hub/data/signals.json hub/data/hormuz.json
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh unified intelligence hub $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Failed to push hub signals after 3 attempts." >&2
            exit 1
          fi
