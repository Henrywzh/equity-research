name: Repository Keepalive

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: repo-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update heartbeat file
        run: |
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-keepalive.txt

      - name: Commit heartbeat update
        run: |
          set -euo pipefail
          git config user.name "repo-keepalive[bot]"
          git config user.email "repo-keepalive[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-keepalive.txt
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: monthly keepalive [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push keepalive heartbeat after 3 attempts." >&2
          exit 1
