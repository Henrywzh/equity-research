name: Repository Keepalive

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: repo-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update heartbeat file
        run: |
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-keepalive.txt

      - name: Commit heartbeat update
        run: |
          git config user.name "repo-keepalive[bot]"
          git config user.email "repo-keepalive[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-keepalive.txt
          git diff --staged --quiet || git commit -m "chore: monthly keepalive [skip ci]"
          git push
