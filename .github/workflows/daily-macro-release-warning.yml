name: Daily Macro Release Warning

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-macro-release-warning
  cancel-in-progress: false

jobs:
  warn:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: daily-macro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-macro/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Send release warning if needed
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python -m daily_macro warn-tomorrow
