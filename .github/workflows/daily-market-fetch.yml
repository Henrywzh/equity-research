name: Daily Market Fetch

on:
  schedule:
    - cron: "59 22 * * *"   # 06:59 HKT — morning brief (recaps US/EU close + Asia overnight)
    - cron: "0 10 * * *"    # 18:00 HKT — evening brief (recaps Asia close + early EU)
  workflow_dispatch:
    inputs:
      session:
        description: "Session to run (morning or evening). Defaults to auto-detect."
        required: false
        default: ""

concurrency:
  group: daily-market-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: daily-market

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-market/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Determine session
        id: session
        run: |
          if [ -n "${{ github.event.inputs.session }}" ]; then
            SESSION="${{ github.event.inputs.session }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 20 ] || [ "$HOUR" -lt 4 ]; then
              SESSION="morning"
            else
              SESSION="evening"
            fi
          fi
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "Detected session: $SESSION"

      - name: Fetch market data and send summary
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          python -m daily_market fetch --session ${{ steps.session.outputs.session }} --json

      - name: Commit updated data
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "daily-market[bot]"
          git config user.email "daily-market[bot]@users.noreply.github.com"
          git add daily-market/data
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "data: refresh daily market ${{ steps.session.outputs.session }} $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase --autostash origin/main
          done
          echo "Failed to push daily-market data after 3 attempts." >&2
          exit 1
