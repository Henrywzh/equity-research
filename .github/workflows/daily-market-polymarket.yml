name: Daily Market Polymarket

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-market-polymarket
  cancel-in-progress: false

jobs:
  fetch-polymarket:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: daily-market

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-market/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Fetch Polymarket snapshots
        run: |
          python -m daily_market fetch-polymarket --json

      - name: Commit updated data
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "daily-market-polymarket[bot]"
          git config user.email "daily-market-polymarket[bot]@users.noreply.github.com"
          git add daily-market/data
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "data: refresh polymarket snapshots $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push Polymarket data after 3 attempts." >&2
          exit 1
