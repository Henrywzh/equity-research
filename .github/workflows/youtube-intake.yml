name: YouTube Intake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: youtube-intake

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: youtube-intake/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run intake pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m youtube_intake run --result-path run-result.json

      - name: Analyze newly archived videos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m youtube_intake analyze --result-path run-result.json --analysis-result-path analysis-result.json

      - name: Send Gmail analyst summary
        env:
          YOUTUBE_INTAKE_GMAIL_SENDER: ${{ secrets.YOUTUBE_INTAKE_GMAIL_SENDER }}
          YOUTUBE_INTAKE_GMAIL_APP_PASSWORD: ${{ secrets.YOUTUBE_INTAKE_GMAIL_APP_PASSWORD }}
          YOUTUBE_INTAKE_GMAIL_RECIPIENT: ${{ secrets.YOUTUBE_INTAKE_GMAIL_RECIPIENT }}
        run: python -m youtube_intake notify --result-path analysis-result.json

      - name: Commit updated state and archives
        working-directory: .
        run: |
          git config user.name "youtube-intake[bot]"
          git config user.email "youtube-intake[bot]@users.noreply.github.com"
          git add -A youtube-intake/data youtube-intake/state
          git diff --staged --quiet || git commit -m "data: refresh youtube intake $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
