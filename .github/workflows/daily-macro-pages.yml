name: Daily Macro Site

on:
  push:
    branches:
      - main
    paths:
      - daily-macro/data/analyses/**
      - daily-macro/src/daily_macro/site.py
      - daily-macro/src/daily_macro/analysis.py
      - daily-macro/src/daily_macro/cli.py
      - daily-macro/README.md
      - .github/workflows/daily-macro-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-macro-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: daily-macro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-macro/pyproject.toml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Build static site
        run: python -m daily_macro build-site --json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: daily-macro/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
