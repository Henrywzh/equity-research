name: Daily Macro Scraper

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: daily-macro-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: daily-macro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-macro/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Scrape HKEJ instant news
        run: python -m daily_macro scrape

      - name: Cleanup old parsed JSON backups
        run: python -m daily_macro cleanup --retention-days 30

      - name: Refresh macro nowcasts
        run: python -m daily_macro nowcasts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit updated data
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "daily-macro[bot]"
          git config user.email "daily-macro[bot]@users.noreply.github.com"
          git add daily-macro/data
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "data: refresh daily macro scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase --autostash origin/main
          done
          echo "Failed to push daily-macro scrape data after 3 attempts." >&2
          exit 1
