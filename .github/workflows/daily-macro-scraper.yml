name: Daily Macro Scraper

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: daily-macro-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: daily-macro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: daily-macro/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Scrape HKEJ instant news
        run: python -m daily_macro scrape

      - name: Cleanup old parsed JSON backups
        run: python -m daily_macro cleanup --retention-days 30

      - name: Commit updated data
        working-directory: .
        run: |
          git config user.name "daily-macro[bot]"
          git config user.email "daily-macro[bot]@users.noreply.github.com"
          git add daily-macro/data
          git diff --staged --quiet || git commit -m "data: refresh daily macro scrape $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
