name: Guolaoxing Article Alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      send_latest_test:
        description: "Send a test email with the latest articles on guolaoxing.com"
        required: false
        default: "false"

concurrency:
  group: guolaoxing-alert
  cancel-in-progress: false

jobs:
  check-new-articles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Check guolaoxing.com for new articles and send alert
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.send_latest_test }}" = "true" ]; then
            EXTRA_ARGS="--send-latest-test"
          fi
          python guolaoxing/email_alert.py $EXTRA_ARGS

      - name: Commit updated seen_posts state
        run: |
          set -euo pipefail
          git config user.name "guolaoxing-alert[bot]"
          git config user.email "guolaoxing-alert[bot]@users.noreply.github.com"
          git add guolaoxing/state/seen_posts.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "data: update guolaoxing seen posts $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase --autostash origin/main
          done
          echo "Failed to push guolaoxing alert state after 3 attempts." >&2
          exit 1
