[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-intake"
version = "0.1.0"
description = "Scheduled YouTube intake pipeline for finance channels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "youtube-transcript-api>=1.2.0",
  "yt-dlp>=2026.3.17",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
